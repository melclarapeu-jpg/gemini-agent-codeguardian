name: CodeGuardian Alpha Test

# Quando este agente deve acordar?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permite apertar um botão para rodar manualmente

jobs:
  test-agent-brain:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o seu repositório na máquina virtual do GitHub
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Instala o Python
    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"

    # 3. Instala as ferramentas (requirements.txt)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Roda o Agente (O script agent.py)
    # IMPORTANTE: Ele precisa da CHAVE (Secret) para funcionar
    - name: Run CodeGuardian Agent
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        python agent.py

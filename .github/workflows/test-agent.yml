name: Teste Alfa do CodeGuardian

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-agent-brain:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do repositório
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Instala o Python
    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"

    # 3. Instala as ferramentas necessárias
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai

    # 4. EXECUTA O AGENTE (Com a chave secreta!)
    - name: Run CodeGuardian Agent
      env:
        # É aqui que a mágica acontece. Passamos a chave do cofre para o script.
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: python agent.py

